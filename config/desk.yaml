# Desk configuration. Hashed into every artefact — see src/config.py.
#
# Every value here was chosen by the research engineer and is recorded with its
# reasoning in research/decisions/2026-08-09-scope-decisions.md. The principal can
# overturn any of them; changing a value changes the config hash, which invalidates
# artefacts rather than silently reusing them.

scope:
  primary_instrument: ES
  secondary_instrument: NQ          # phase 5 generalisation test only, run once
  study_start: 2021-01-01
  study_end: 2026-06-30
  # Anchors (t0) may only fall in RTH. Feature lookback windows may reach back
  # through the overnight session — see D5 in the decisions record.
  anchor_session: RTH
  splits:                           # by session count, chronological, never shuffled
    train: 0.60
    validation: 0.15
    holdout: 0.25

session:
  timezone: America/Chicago         # RTH is defined in Chicago time; UTC offset moves
  rth_open: "08:30"
  rth_close: "15:00"
  eth_open: "17:00"                 # previous calendar day
  eth_close: "16:00"
  maintenance_break_minutes: 60     # 16:00-17:00 CT
  early_close: "12:00"              # on half days
  calendar_file: config/calendar/cme_equity.yaml

contract:
  months: [H, M, U, Z]              # quarterly cycle
  roll_rule: volume                 # volume | calendar
  roll_volume_lookback_sessions: 2
  # The crossover is only observable after the session closes, so the roll takes
  # effect at the next session's open. This is leak L7 in the spec review.
  roll_publication_lag_sessions: 1
  tick_size: 0.25
  point_value: 50.0                 # ES; NQ is 20.0 and is set per-instrument at phase 5

bars:
  # Bar close timestamps are the only valid anchors. See leak L1.
  time_seconds: 60
  volume_contracts: 2500
  dollar_notional: 500_000_000
  # Volume and dollar thresholds drift as market volume trends over five years.
  # Recalibrated from a trailing window only — never from the full period.
  threshold_recalibration:
    enabled: true
    trailing_sessions: 20
    target_bars_per_session: 120

labels:
  # Phase 2 groundwork. Barriers are ATR-scaled; the lookback is pre-registered here
  # so it cannot be tuned after seeing results.
  atr_sessions: 14
  atr_sessions_robustness: 60       # second pre-declared scaling, run on every headline
  target_atr_multiple: 2.0
  stop_atr_multiple: 1.0
  time_barrier_minutes: 120
  mae_floor_ticks: 1                # denominator floor for asymmetry = MFE / MAE_before

execution_realism:
  # Not an execution layer. These enter the cost floor computed at the phase 3 gate.
  decision_lag_seconds: 1
  commission_per_side_usd: 1.24
  spread_ticks: 1.0
  slippage_ticks_per_atr: 0.25

statistics:
  bootstrap_resamples: 10000
  # Events cluster within a session. i.i.d. resampling understates every CI —
  # see W2 in the spec review.
  bootstrap_block: session_day
  confidence_level: 0.95
  fdr_alpha: 0.05

determinism:
  seed: 20260809
  duckdb_threads: 1
  parquet_compression: zstd
  parquet_compression_level: 3

data:
  # Set to a real Rithmic snapshot id once data exists. Anything beginning with
  # "synthetic" marks every downstream artefact as non-research output.
  version: synthetic-v1
  root: data
