# Pre-registered hypothesis family 01 — context and the right tail of forward excursion
#
# Registered 2026-08-09, before any conditional analysis was run. Immutable once
# committed: to change a hypothesis, register a new one with a new id and leave this
# entry in place. The file's own git history is the evidence that it predates the result.
#
# Every hypothesis is reported in the results table whether it passes or fails.
# Benjamini-Hochberg is applied across this file as one family (decision D8), and the
# family size is len(hypotheses) — not the experiment log's trial count, which is larger
# and is reported separately.
#
# The pre-declared minimum effect of 1.5 comes from decision D6 and is the same for every
# hypothesis here. A ratio below it is a failure even if its interval excludes 1.0: an
# effect can be real and still too small to matter.

family: excursion_context
registered: 2026-08-09
alpha: 0.05
statistic: tail_probability          # P(MFE > threshold x stop distance)
metric: mfe_stops
split: tercile                       # top tercile of the feature against the bottom
minimum_effect: 1.5                  # ratio of tail probabilities, top / bottom

hypotheses:
  - id: H1
    feature: realised_vol_ratio
    trigger_family: all
    direction: positive
    threshold: 2.0
    rationale: >
      The thesis says large fast moves resolve positioning imbalance. Volatility
      accelerating relative to its own recent norm is the most direct observable proxy
      for that stress available without order book depth. If nothing here works, this is
      the one that should have.
    falsified_if: >
      The top-tercile tail probability is not at least 1.5x the bottom-tercile one, with
      a BH-adjusted block-bootstrapped 95% interval excluding 1.0.

  - id: H2
    feature: overnight_range_atr
    trigger_family: all
    direction: positive
    threshold: 2.0
    rationale: >
      A wide overnight range says the auction failed to find agreement while most
      participants were away. Positions built into that disagreement are the fuel the
      thesis is about.
    falsified_if: same as H1, applied to this feature.

  - id: H3
    feature: initial_balance_range_atr
    trigger_family: all
    direction: negative
    threshold: 2.0
    rationale: >
      The one prediction here that runs against the naive reading. A narrow initial
      balance is compressed disagreement, not absent disagreement, and auction theory
      says compression precedes extension. If the effect comes out positive with a tight
      interval, the framework has a problem worth writing down.
    falsified_if: >
      The bottom-tercile tail probability is not at least 1.5x the top-tercile one. A
      positive effect of any size falsifies this hypothesis as stated.

  - id: H4
    feature: cumulative_delta_ratio
    trigger_family: all
    direction: positive
    threshold: 2.0
    rationale: >
      Aggressor imbalance in the direction of the trigger should precede continuation if
      informed flow is observable at all. Directly tests the "partially observable"
      clause of the thesis.
    falsified_if: same as H1, applied to the side-aligned delta ratio.

  - id: H5
    feature: distance_from_vwap_atr
    trigger_family: all
    direction: positive
    threshold: 2.0
    rationale: >
      Distance from the developing VWAP measures how far the auction has travelled from
      its own centre of mass. Trend days sustain it; balanced days revert from it.
    falsified_if: same as H1, applied to this feature.

  - id: H6
    feature: minutes_into_session
    trigger_family: all
    direction: negative
    threshold: 2.0
    rationale: >
      A deliberate near-null. Time of day is not a market state, and if it produces a
      large surviving effect the most likely explanation is that the trigger families
      are time-clustered rather than that the clock predicts excursion. Included as a
      diagnostic on the apparatus, not because anyone expects a finding.
    falsified_if: >
      Fails on its own terms if the effect is not negative and above 1.5x. Its more
      useful failure mode is succeeding, which would indict the event construction.
